name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HPI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -ntp versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Create checksum
        run: sha256sum target/unity-support.hpi > target/unity-support.hpi.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-support-hpi
          path: |
            target/unity-support.hpi
            target/unity-support.hpi.sha256
          if-no-files-found: error
          
  release:
  name: Publish GitHub Release
  runs-on: ubuntu-latest
  needs: build
  if: startsWith(github.ref, 'refs/tags/v')
  permissions:
    contents: write

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download HPI artifact
      uses: actions/download-artifact@v4
      with:
        name: unity-support-hpi
        path: release-assets

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${GITHUB_REF_NAME}"
        if gh release view "${TAG}" >/dev/null 2>&1; then
          gh release upload "${TAG}" release-assets/unity-support.hpi release-assets/unity-support.hpi.sha256 --clobber
        else
          gh release create "${TAG}" release-assets/unity-support.hpi release-assets/unity-support.hpi.sha256 \
            --title "${TAG}" \
            --notes "Unity Support ${TAG}"
        fi